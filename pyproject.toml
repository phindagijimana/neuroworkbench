[build-system]
requires = ["setuptools>=65.5"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroworkbench"
version = "0.1.0"
description = "NeuroWorkbench: fail-closed neuroimaging workbench (approve, receipt, silent success)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
neuroworkbench = "neuroworkbench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kernel*", "neuroworkbench*", "baselines*", "provenance*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
